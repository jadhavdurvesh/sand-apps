<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e13"><title>SAND Desktop — Apps</title><link rel="stylesheet" href="style.css"></head>
<body class="desktop-body">
<div class="desktop-menubar"><button id="launcher-toggle" class="sand-menu"><span class="sand-menu-mark">S</span><strong>SAND</strong></button><span class="menubar-divider"></span><span class="menubar-label">DESKTOP PREVIEW</span><div class="menubar-spacer"></div><span class="desktop-status"><i></i> HOST SESSION</span><button id="notification-toggle" class="menubar-icon" aria-label="Notification center">◉</button><time id="desktop-clock"></time></div>
<main id="desktop-workspace" class="desktop-workspace" aria-label="Desktop workspace"><div class="desktop-welcome"><div class="welcome-mark">S</div><p class="eyebrow">SAND OS · APPLICATION ENVIRONMENT</p><h1>A quieter space<br>to get things done.</h1><p>Open an application from the dock or press <kbd>Alt</kbd> + <kbd>Space</kbd>.</p></div></main>
<div id="launcher" class="launcher-panel" hidden><div class="launcher-heading"><span class="eyebrow">APPLICATIONS</span><button class="panel-close" onclick="document.querySelector('#launcher').hidden=true" aria-label="Close launcher">×</button></div><input id="launcher-search" class="field" type="search" placeholder="Search applications…" autocomplete="off"><div id="launcher-apps" class="launcher-app-grid"></div><div class="launcher-foot">SAND CORE SUITE · HOST PREVIEW</div></div>
<aside id="notification-center" class="notification-center" hidden><div class="notification-heading"><div><span class="eyebrow">DESKTOP</span><h2>Notifications</h2></div><button class="panel-close" onclick="document.querySelector('#notification-center').hidden=true" aria-label="Close notifications">×</button></div><div id="notification-list"></div></aside>
<div id="desktop-toast" class="desktop-toast" role="status" hidden></div>
<nav id="dock" class="desktop-dock" aria-label="Application dock"><button data-dock-app="cairn" title="CAIRN — Terminal"><span class="dock-icon">›_</span><small>CAIRN</small><i></i></button><button data-dock-app="locus" title="LOCUS — Files"><span class="dock-icon">▤</span><small>LOCUS</small><i></i></button><button data-dock-app="quanta" title="QUANTA — Calculator"><span class="dock-icon">∑</span><small>QUANTA</small><i></i></button><button data-dock-app="cadence" title="CADENCE — Tasks"><span class="dock-icon">✓</span><small>CADENCE</small><i></i></button><button data-dock-app="keystone" title="KEYSTONE — Settings"><span class="dock-icon">⚙</span><small>KEYSTONE</small><i></i></button></nav>
<script src="../sdk/runtime/sand-runtime.js"></script><script src="../sdk/runtime/desktop-services.js"></script><script src="cairn.js"></script>
<script src="../applications/cairn/app.js"></script>
<script src="../applications/locus/app.js"></script>
<script src="../applications/quanta/app.js"></script>
<script src="../applications/cadence/app.js"></script>
<script src="../applications/keystone/app.js"></script>
<script src="app.js"></script></body></html>
