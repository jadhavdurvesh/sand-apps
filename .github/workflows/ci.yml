name: SAND Apps CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python unit tests
        run: make test
      - name: JavaScript runtime and CAIRN tests
        run: make test-js
      - name: Validate app catalogue
        run: make apps
      - name: Check preview JavaScript syntax
        run: |
          node --check preview/app.js
          node --check preview/cairn.js
      - name: Build SAND Hello package
        run: make clean all
      - name: Upload SAPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sand-hello-sapp
          path: build/hello.sapp
